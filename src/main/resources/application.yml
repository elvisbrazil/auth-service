spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/auth
    username: auth
    password: auth
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

auth:
  jwt:
    issuer: auth-service
    access-token-ttl: 15m
  refresh-token:
    ttl: 14d
  login-throttle:
    max-failures: 5
    lock-duration: 15m
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
